MEMORY {
    ZP: file = "", start = $0002, size = $001A;
    APP: file = %O, start = $1000, size = $2400;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    STARTUP: load = APP, type = ro;
    CODE: load = APP, type = ro;
    RODATA: load = APP, type = ro;
    DATA: load = APP, type = rw;
    BSS: load = APP, type = bss, define = yes;
}
